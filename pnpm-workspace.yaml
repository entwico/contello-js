packages:
  - packages/*
  - demo/*

overrides:
  vite: ^8.0.0

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10' # works fine on v10

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@astroscope/*'
  - '@entwico/*'

allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
